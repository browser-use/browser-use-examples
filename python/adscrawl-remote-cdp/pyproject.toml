[project]
name = "adscrawl-browser-use-example"
version = "0.1.0"
description = "User-authorized page reading with Browser Use 1.0 and AdsCrawl Remote CDP"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
dependencies = [
  "browser-use==1.0.4",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-socket==0.7.0",
  "ruff==0.14.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["."]
norecursedirs = [".venv", ".git", ".pytest_cache", ".ruff_cache"]
addopts = "--strict-markers --disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
